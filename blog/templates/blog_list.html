{% extends 'base.html' %}
{% block title %}Список блогов{% endblock %}

{% block content %}
{% include 'header.html' %}
<h1 class="mb-4">Список объектов MyModel</h1>
        <a href="{% url 'mymodel_create' %}" class="btn btn-primary mb-3">Создать новый блог</a>
        <ul class="list-group">
            {% for blog in blogs %}
                <li class="list-group-item">
                    <a href="{% url 'blog_detail' blog.pk %}">{{ blog.title }}</a>
                    <a href="{% url 'blog_form' blog.pk %}" class="btn btn-sm btn-secondary ml-3">Редактировать</a>
                    <a href="{% url 'blog_delete' blog.pk %}" class="btn btn-sm btn-danger ml-1">Удалить</a>
                </li>
            {% endfor %}
        </ul>
{% endblock %}
